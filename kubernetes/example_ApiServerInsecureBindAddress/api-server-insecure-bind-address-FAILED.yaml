apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-apiserver
  labels:
    k8s-app: kube-apiserver
spec:
  replicas: 1
  selector:
    matchLabels:
      k8s-app: kube-apiserver
      component: apiserver
      provider: kubernetes
  template:
    metadata:
      labels:
        k8s-app: kube-apiserver
        component: apiserver
        provider: kubernetes
    spec:
      serviceAccountName: kube-apiserver
      tolerations:
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      containers:
      - name: kube-apiserver
        image: k8s.gcr.io/kube-apiserver@sha256:4ae8c24a97630f8cfc9eed02fb95e2371d172bb231915e83d27f6ea0e64fa297 # v1.36.0
        command:
        - kube-apiserver
        - --insecure-bind-address=192.168.1.1
