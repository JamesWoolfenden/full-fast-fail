apiVersion: v1
kind: Pod
metadata:
  creationTimestamp: null
  labels:
    component: kube-apiserver
    tier: control-plane
  name: kube-apiserver-not-secure
  namespace: kube-system
spec:
  containers:
  - command:
    - kube-apiserver
    - --secure-port=0
    image: gcr.io/google_containers/kube-apiserver-amd64@sha256:0524beb2e07d6a5d21eb39cb70d82bea093e5f4c9fa5c4bdf2d44e437d425b61 # v1.6.0
    livenessProbe:
      failureThreshold: 8
      httpGet:
        host: 127.0.0.1
        path: /healthz
        port: 6443
        scheme: HTTPS
      initialDelaySeconds: 15
      timeoutSeconds: 15
    name: kube-apiserver
